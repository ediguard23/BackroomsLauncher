appId: com.backrooms.launcher
productName: Backrooms Launcher
copyright: Copyright © 2026 PeakMC Studio

directories:
  output: dist
  buildResources: assets

# Solo lo que necesita el programa. pack/, dist-pack/ y tools/ son del
# organizador y no viajan en el instalador.
files:
  - main.js
  - preload.js
  - package.json
  - src/**/*
  - assets/**/*
  - '!assets/**/*.psd'
  - '!assets/fuentes-ia/**'
  - '!assets/PROMPTS.md'
  - '!assets/instalador/**'
  - '!**/*.map'

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico

nsis:
  # Sin espacios: latest.yml referencia el archivo con guiones y, si el .exe
  # lleva espacios, la actualizacion automatica da 404 al buscarlo.
  artifactName: Backrooms-Launcher-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # El del escritorio lo pregunta la ultima pantalla (casilla); el del menu Inicio va
  # siempre, que es lo que hace que salga al buscar "Backrooms" en Windows.
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Backrooms Launcher
  uninstallDisplayName: Backrooms Launcher
  differentialPackage: true
  # Aspecto: icono de la puerta, barra lateral y cabecera del evento (tools/instalador/generar.ps1)
  # y las pantallas propias de assets/instalador/instalador.nsh. En español.
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  installerSidebar: assets/instalador/lateral.bmp
  uninstallerSidebar: assets/instalador/lateral.bmp
  installerHeader: assets/instalador/cabecera.bmp
  include: assets/instalador/instalador.nsh
  installerLanguages: [es_ES]
  language: '3082'

# El launcher se actualiza solo desde las releases de este repositorio. El
# pack del evento vive en la release con tag "pack", que se crea con
# make_latest=false para que el actualizador no la confunda con una version.
publish:
  provider: github
  owner: ediguard23
  repo: BackroomsLauncher
  releaseType: release
